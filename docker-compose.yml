services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    networks:
      - jarvis-net
    env_file: .env
    environment:
      - BACKEND_TS_URL=http://backend-ts:8001
    depends_on:
      backend-ts:
        condition: service_healthy
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:1.0.12
    container_name: jarvis-chromadb
    expose:
      - "8000"
    networks:
      - jarvis-net
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  backend-ts:
    build:
      context: .
      dockerfile: Dockerfile.backend-ts
    container_name: jarvis-backend-ts
    expose:
      - "8001"
    networks:
      - jarvis-net
    volumes:
      - ./data:/app/data
      - whisper-models:/app/node_modules/nodejs-whisper/cpp/whisper.cpp/models
    env_file: .env
    environment:
      - BACKEND_TS_PORT=8001
      - NODE_ENV=production
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # Whisper model: tiny, base, small, medium, large-v3
      # medium (1.5GB): 2x slower than base, significantly better accuracy (especially pt-BR)
      # GPU support: Vulkan (cross-platform) + CUDA (NVIDIA) compiled in, auto-detected at runtime
      - WHISPER_MODEL=medium
    depends_on:
      chromadb:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  whisper-models:
  chroma-data:

networks:
  jarvis-net:
    driver: bridge
