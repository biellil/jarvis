services:
  python-service:
    build:
      context: .
      dockerfile: Dockerfile.python
    expose:
      - "8000"
    networks:
      - jarvis-net
    volumes:
      - ./data:/app/data
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    networks:
      - jarvis-net
    env_file: .env
    environment:
      - FASTAPI_URL=http://python-service:8000
    depends_on:
      python-service:
        condition: service_healthy
    restart: unless-stopped

  backend-ts:
    build:
      context: .
      dockerfile: Dockerfile.backend-ts
    container_name: jarvis-backend-ts
    expose:
      - "8001"  # Internal only, not published until Phase 21
    networks:
      - jarvis-net
    volumes:
      - ./data:/app/data  # Prepared for SQLite/ChromaDB in Phase 16
    env_file: .env
    environment:
      - BACKEND_TS_PORT=8001
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"  # For LM Studio access
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  jarvis-net:
    driver: bridge
