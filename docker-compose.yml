services:
  python-service:
    build:
      context: .
      dockerfile: Dockerfile.python
    expose:
      - "8000"
    networks:
      - jarvis-net
    volumes:
      - ./data:/app/data
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    networks:
      - jarvis-net
    env_file: .env
    environment:
      - FASTAPI_URL=http://python-service:8000
    depends_on:
      python-service:
        condition: service_healthy
    restart: unless-stopped

networks:
  jarvis-net:
    driver: bridge
