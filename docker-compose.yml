services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    networks:
      - jarvis-net
    env_file: .env
    environment:
      - BACKEND_TS_URL=http://backend-ts:8001
    depends_on:
      backend-ts:
        condition: service_healthy
    restart: unless-stopped

  backend-ts:
    build:
      context: .
      dockerfile: Dockerfile.backend-ts
    container_name: jarvis-backend-ts
    expose:
      - "8001"
    networks:
      - jarvis-net
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      - BACKEND_TS_PORT=8001
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  jarvis-net:
    driver: bridge
