# Langfuse self-hosted stack — Phase 83
# Usage:
#   cd infra/langfuse/
#   cp .env.example .env
#   # Edit .env: set NEXTAUTH_SECRET to output of: openssl rand -base64 32
#   docker compose up -d
#   # Langfuse UI available at http://localhost:3100
#   # Create project + API keys at http://localhost:3100/project
#   # Copy keys to root .env: LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY
#   # Set LANGFUSE_ENABLED=true in root .env to activate tracing
#
# Notes:
#   - MinIO omitted for MVP (Langfuse works without file attachment storage)
#   - PostgreSQL data persists in 'postgres-storage' named volume (survives restarts)
#   - Privacy: traces stored in LOCAL PostgreSQL only, never sent externally unless
#     you change LANGFUSE_HOST in root .env to https://cloud.langfuse.com

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: langfuse
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}
      NEXTAUTH_URL: http://localhost:3100
      LANGFUSE_TELEMETRY_ENABLED: "false"
    volumes:
      - langfuse-data:/app/data

volumes:
  postgres-storage:
  langfuse-data:
