# Phase 22 Plan 04 — Packaging config com extraResources para wake word models.
# Source: .planning/phases/22-voiceinputmanager-refactor-wake-word-core/22-RESEARCH.md §Pattern 4
#
# Os 4 modelos ONNX (melspectrogram, embedding_model, silero_vad, hey_jarvis_v0.1)
# residem em apps/desktop/resources/wakeword-models/ e são copiados para
# <resourcesPath>/wakeword-models/*.onnx durante o build. O runtime path resolver
# em apps/desktop/src/main/voiceInput/resources.ts usa process.resourcesPath
# quando app.isPackaged===true.
#
# IMPORTANTE: NÃO usamos asarUnpack — extraResources é a opção correta para
# assets externos ao bundle JS (pitfall #5 do research).

appId: com.jarvis.desktop
productName: JARVIS

# 22-GAP-11: version explícita — pnpm hoista electron pra .pnpm/ e o
# electron-builder falha em detectar a versão automaticamente.
electronVersion: 41.1.1

directories:
  # 22-GAP-15: output incrementado pra evitar Windows file lock no app.asar
  # (Windows Defender escaneia o asar por longo tempo, segurando handle).
  # Dev pode apagar release/ antigo manualmente quando puder.
  output: release-v2
  buildResources: resources

files:
  - dist/**/*
  - package.json
  # 22-GAP-13: bloqueia node_modules do asar. O bundling do electron-vite
  # com externalizeDeps:false inclui electron-store/conf/ajv inline no
  # dist/main/index.js — não precisamos de node_modules em runtime.
  # Previne pnpm symlink resolution hell (ERR_MODULE_NOT_FOUND pra ajv).
  - "!node_modules/**/*"

# 22-GAP-13: zera dependencies no package.json empacotado pra que
# electron-builder não tente walk-and-copy node_modules automaticamente.
# O dist/main/index.js bundlado tem tudo inline (~431 KB) — zero deps runtime.
extraMetadata:
  dependencies: {}
  devDependencies: {}

extraResources:
  - from: resources/wakeword-models
    to: wakeword-models
    filter:
      - "*.onnx"
      - "LICENSE*"
  # Phase 29 (STT-01, INFRA-01): native @fugood/whisper.node bindings.
  # Externalized from Vite bundle — must be copied from monorepo root node_modules.
  # Layout mirrors node_modules so require('@fugood/...') resolves via extraResourcesPath.
  # electron-vite.config.ts externalizes /^@fugood\// so runtime require works.
  - from: "../../node_modules/@fugood/whisper.node"
    to: "node_modules/@fugood/whisper.node"
    filter:
      - "lib/**"
      - "package.json"
  - from: "../../node_modules/@fugood/node-whisper-win32-x64"
    to: "node_modules/@fugood/node-whisper-win32-x64"
    filter:
      - "index.node"
      - "package.json"
  - from: "../../node_modules/@fugood/node-whisper-win32-x64-cuda"
    to: "node_modules/@fugood/node-whisper-win32-x64-cuda"
    filter:
      - "index.node"
      - "package.json"
  - from: "../../node_modules/@fugood/node-whisper-win32-x64-vulkan"
    to: "node_modules/@fugood/node-whisper-win32-x64-vulkan"
    filter:
      - "index.node"
      - "package.json"
  # Phase 33 (D-04, D-06): macOS prebuilds — Apple Silicon (Metal GPU)
  - from: "node_modules/@fugood/node-whisper-darwin-arm64"
    to: "node_modules/@fugood/node-whisper-darwin-arm64"
    filter:
      - "index.node"
      - "package.json"
  # Phase 33 (D-04, D-06): macOS prebuilds — Intel Mac (CPU/Metal GPU)
  - from: "node_modules/@fugood/node-whisper-darwin-x64"
    to: "node_modules/@fugood/node-whisper-darwin-x64"
    filter:
      - "index.node"
      - "package.json"
  # Phase 33 (D-04, D-06): Linux prebuilds — x64 CPU baseline
  - from: "node_modules/@fugood/node-whisper-linux-x64"
    to: "node_modules/@fugood/node-whisper-linux-x64"
    filter:
      - "index.node"
      - "package.json"
  # Phase 33 (D-04, D-06): Linux prebuilds — x64 CUDA GPU
  - from: "node_modules/@fugood/node-whisper-linux-x64-cuda"
    to: "node_modules/@fugood/node-whisper-linux-x64-cuda"
    filter:
      - "index.node"
      - "package.json"
  # Phase 33 (D-04, D-06): Linux prebuilds — x64 Vulkan GPU
  - from: "node_modules/@fugood/node-whisper-linux-x64-vulkan"
    to: "node_modules/@fugood/node-whisper-linux-x64-vulkan"
    filter:
      - "index.node"
      - "package.json"
  # Phase 62 (TTS-OFF-01): onnxruntime-node native addon + DLLs — externalized from
  # Vite bundle (same pattern as @fugood/whisper.node). kokoro-js and
  # @huggingface/transformers are also externalized (ESM-only, pull onnxruntime-node).
  - from: "../../node_modules/onnxruntime-node"
    to: "node_modules/onnxruntime-node"
    filter:
      - "package.json"
      - "lib/**"
      - "dist/**"
      - "bin/napi-v3/win32/x64/*.node"
      - "bin/napi-v3/win32/x64/*.dll"
  - from: "../../node_modules/@huggingface/transformers"
    to: "node_modules/@huggingface/transformers"
    filter:
      - "package.json"
      - "src/**"
      - "dist/**"
  - from: "../../node_modules/kokoro-js"
    to: "node_modules/kokoro-js"
    filter:
      - "package.json"
      - "dist/**"
      - "types/**"
  # Phase 63 (VISION-01, D-10): sharp native addon — @img/sharp-* platform packages.
  # sharp 0.33+ uses @img/sharp-{platform}-{arch} for native binaries (not build/Release).
  # electron.vite.config.ts externalizes 'sharp' so runtime require('@img/...') resolves.
  - from: "../../node_modules/@img/sharp-win32-x64"
    to: "node_modules/@img/sharp-win32-x64"
    filter:
      - "lib/**"
      - "package.json"
  # Phase 71 (DIST-03 mac universal): sharp darwin prebuilds — required for
  # macOS DMG universal binary to load sharp at runtime. Both arches needed
  # because mac.arch: [universal] uses @electron/universal to lipo-merge.
  - from: "../../node_modules/@img/sharp-darwin-arm64"
    to: "node_modules/@img/sharp-darwin-arm64"
    filter:
      - "lib/**"
      - "package.json"
  - from: "../../node_modules/@img/sharp-darwin-x64"
    to: "node_modules/@img/sharp-darwin-x64"
    filter:
      - "lib/**"
      - "package.json"
  # Phase 71 (DIST-04 linux): sharp linux x64 prebuild — required for AppImage
  # to load sharp at runtime. Without this, AppImage builds OK but crashes in
  # runtime on require('sharp') in the vision pipeline.
  - from: "../../node_modules/@img/sharp-linux-x64"
    to: "node_modules/@img/sharp-linux-x64"
    filter:
      - "lib/**"
      - "package.json"
  - from: "../../node_modules/@img/colour"
    to: "node_modules/@img/colour"
    filter:
      - "*.cjs"
      - "*.d.ts"
      - "package.json"
  # Phase 63: sharp main package (lib/*.js) — externalized but needs to be resolvable
  - from: "../../node_modules/sharp"
    to: "node_modules/sharp"
    filter:
      - "lib/**"
      - "package.json"
  # Phase 30 (STT-02, D-05, D-06) + Phase 71 (D-11, D-12): Whisper model binaries
  # pre-bundled at build time. Phase 71 narrows the bundle to base + medium
  # (~1.7 GB total). Tiny/small/large-v3-turbo are downloaded on-demand via
  # Settings UI (WHISPER-01 / Phase 50). Filter aligned with post-Phase 68 UI
  # model list (tiny/base/small/medium/large-v3-turbo — no more large-v3).
  # Layout in packaged app: <resourcesPath>/models/whisper/*.bin
  # whisperResources.ts resolves the path (userData first, fallback resourcesPath).
  - from: "resources/models/whisper"
    to: "models/whisper"
    filter:
      - "ggml-base.bin"
      - "ggml-medium.bin"
  # Phase 71 (D-09): bundle .env.example for first-run copy in packaged app.
  # apps/desktop/src/main/firstRunEnv.ts reads from process.resourcesPath/.env.example
  # and copies to userData/.env on first run (Phase 71 Plan 01).
  - from: "../../.env.example"
    to: ".env.example"

asar: true

win:
  # Phase 71 (D-06, DIST-01 + DIST-02): NSIS installer + portable.
  # No 'arch' declared — default x64 (no demand for arm64 Windows in v3.1).
  # NSIS defaults applied automatically:
  #   oneClick: true             (one-step install)
  #   perMachine: false          (installs to %APPDATA%\Local\Programs\JARVIS)
  #   createStartMenuShortcut: true   (Start Menu shortcut — DIST-01)
  #   createDesktopShortcut: true     (Desktop shortcut — bonus)
  #   runAfterFinish: true       (opens JARVIS after install)
  #   Uninstaller registry entry: automatic (Control Panel — DIST-01)
  target:
    - nsis
    - portable

mac:
  # Phase 71 (D-06 CORRECTED, DIST-03): DMG universal (arm64 + x64 merged).
  # Research §Pitfall 1 + §State of the Art: arch: [universal] produces 1 DMG
  # with lipo-merged native modules + merged ASARs (mergeASARs: true is default
  # for universal). Using arch: [arm64, x64] would produce 2 SEPARATE DMGs —
  # does NOT satisfy DIST-03 "universal (arm64 + x64)" criterion.
  target:
    - target: dmg
      arch:
        - universal
  extendInfo:
    NSMicrophoneUsageDescription: "JARVIS precisa do microfone para detectar o wake word 'Hey JARVIS'."

linux:
  # Phase 71 (D-06, DIST-04): AppImage — distro-agnostic, FUSE2-based runtime.
  # Ubuntu 24.04 quirk: libfuse2 renamed to libfuse2t64. Runtime workarounds
  # documented in README (libfuse2t64 install OR --appimage-extract-and-run).
  # Electron 41 + AppArmor 4.0 hardening: README documents --no-sandbox flag.
  target: AppImage
  category: Utility
