[project]
name = "jarvis_desktop"
version = "0.1.0"
description = "JARVIS Python desktop client — thin HTTP wrapper for gateway"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "faster-whisper==1.2.1",
    "sounddevice==0.5.5",
    "pynput>=1.7.0",
    "kokoro>=0.9.4",
    "soundfile",
    "elevenlabs",
    "murf",
    "nltk>=3.8.2,<4",
    "openwakeword==0.6.0",
    "onnxruntime>=1.16.0",
    "rich>=13.0",
    "psutil>=6.0",
    "pycaw>=0.9.1; sys_platform == \"win32\"",
]

[project.scripts]
jd = "jarvis_desktop.__main__:_entry"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
voice-cloning = [
    # kokoclone: not on PyPI — install from git when needed:
    #   pip install git+https://github.com/Ashish-Patnaik/kokoclone
    "librosa>=0.10.0",
]
chatterbox = [
    # CHTB-02 (Phase 86) — Chatterbox TTS multilingual com voice cloning + emotion control.
    # NOTA D-18: equivalente funcional a `--no-deps` — uv não suporta --no-deps em pyproject.toml,
    # então usamos override-dependencies (abaixo) + listagem explícita das transitives.
    # Ver justificativa completa em .planning/phases/86-identificacao-de-voz-speaker-recognition/86-02-PLAN.md
    "chatterbox-tts==0.1.7",
    # torch 2.6.0 explícito — confirmado compatível com ctranslate2<5,>=4.0 (faster-whisper)
    "torch==2.6.0",
    "torchaudio==2.6.0",
    # Deps transitivas pinadas pelo chatterbox-tts 0.1.7 (instaladas explicitamente para
    # garantir versões exatas; o resolver do uv vai aplicar override-dependencies para torch).
    "transformers==5.2.0",
    "diffusers==0.29.0",
    "librosa==0.11.0",
    "safetensors==0.5.3",
    "conformer==0.3.2",
    "pykakasi==2.3.0",
    "s3tokenizer",
    "resemble-perth>=1.0.0",
    "omegaconf",
    "pyloudnorm",
    "spacy-pkuseg",
    # Windows AMD/Intel GPU — opcional, pulado em Linux/macOS via marker
    "torch-directml==0.2.5.dev240914; sys_platform == 'win32'",
]
speaker = [
    # Phase 89 — Speaker recognition via resemblyzer GE2E d-vector.
    # webrtcvad-wheels DEVE vir antes de resemblyzer (Pitfall 1, 89-RESEARCH):
    # resemblyzer 0.1.4 declara `webrtcvad>=2.0.10` mas o original não tem wheel cp313
    # Windows; webrtcvad-wheels 2.0.14 é drop-in replacement com wheel cp313.
    "webrtcvad-wheels==2.0.14",
    "resemblyzer==0.1.4",
]
nvidia-gpu = [
    # Phase 91 — NVIDIA GPU aceleração (CUDA)
    # Substitui torch 2.6.0 CPU-only por build CUDA 12.4
    # NOTA: mutuamente exclusivo com torch 2.6.0 do extra [chatterbox]
    # Instalar ANTES do [chatterbox] ou usar: pip install ".[nvidia-gpu,chatterbox]"
    "torch==2.6.0+cu124; sys_platform != 'darwin'",
    "torchaudio==2.6.0+cu124; sys_platform != 'darwin'",
]
amd-gpu-windows = [
    # Phase 91 — AMD GPU no Windows via DirectML (D-01, default AMD path)
    # torch-directml já está no [chatterbox] extra como dep opcional.
    # Este extra torna explícito o install para usuários AMD Windows sem Chatterbox.
    "torch-directml==0.2.5.dev240914; sys_platform == 'win32'",
]
apple-silicon = [
    # Phase 91 — Apple Silicon (M1/M2/M3) via Metal MPS (D-04)
    # PyTorch padrão já inclui MPS backend no wheel macOS arm64.
    # Este extra documenta que nenhum install adicional é necessário.
    # "torch" já está nas deps base — MPS habilitado automaticamente no macOS arm64.
]
vulkan = [
    # Phase 91 — Vulkan detection (D-07)
    # ctranslate2[vulkan] tem wheel conflict com ctranslate2[cuda] — DEFERRED para v3.7+
    # Whisper.cpp com Vulkan backend: instalar whisper-cpp-bindings separado
    # Este extra reservado para quando o conflito for resolvido upstream
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end pipeline tests (PTT → STT → LLM → TTS) — slow",
]

[tool.uv]
# tflite-runtime has no cp312 wheels — openwakeword uses onnxruntime on non-Linux;
# override prevents uv cross-platform resolution failure on Python 3.12
#
# torch / torchvision override (Phase 86, D-18): força torch 2.6.0 mesmo quando
# torch-directml 0.2.5.dev240914 pin torch==2.4.1. Confirmado funcional em produção
# pela comunidade Chatterbox-TTS-Server (RESEARCH Pitfall 1, A1).
# Equivalência funcional de `--no-deps` declarado em CHTB-02 / D-18 — ver 86-02-PLAN.md.
override-dependencies = [
    "tflite-runtime; sys_platform == 'linux' and python_version < '3.12'",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "webrtcvad-wheels==2.0.14",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
