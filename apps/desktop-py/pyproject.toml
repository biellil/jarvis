[project]
name = "jarvis_desktop"
version = "0.1.0"
description = "JARVIS Python desktop client — thin HTTP wrapper for gateway"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
